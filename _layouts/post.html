---
layout: blog
---
<article class="blog-post">
  <header>
    <h1>{{ page.title | escape }}</h1>
    <p><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>
  </header>
  {{ content }}
</article>
<p><a href="{{ '/blog/' | relative_url }}">Back to blog</a></p>
